<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0d0d">
  <title>DbD Board Game Automa Helper</title>
  <link rel="icon" href="resource/icon-bp.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ===== HOME ===== -->
    <section id="screen-home" class="screen">
      <div class="topbar">
        <span></span>
        <span></span>
        <button class="lang-btn" data-action="lang"></button>
      </div>
      <div class="center-col">
        <img class="logo" src="resource/icon-bp.png" alt="">
        <h1 data-i18n="app.title"></h1>
        <p class="sub" data-i18n="app.sub"></p>
        <button class="big-btn killer" data-action="go" data-screen="killer-select">
          <span class="big-title" data-i18n="home.killer"></span>
          <span class="big-sub" data-i18n="home.killerSub"></span>
        </button>
        <button class="big-btn survivor" data-action="go" data-screen="survivors">
          <span class="big-title" data-i18n="home.survivors"></span>
          <span class="big-sub" data-i18n="home.survivorsSub"></span>
        </button>
      </div>
      <p class="foot" data-i18n="app.foot"></p>
    </section>

    <!-- ===== KILLER SELECT ===== -->
    <section id="screen-killer-select" class="screen hidden">
      <div class="topbar">
        <button class="icon-btn" data-action="back" aria-label="back">&lsaquo;</button>
        <span class="topbar-title" data-i18n="home.killer"></span>
        <button class="lang-btn" data-action="lang"></button>
      </div>
      <div class="center-col">
        <p class="sub" data-i18n="select.killerPrompt"></p>
        <div class="killer-grid">
          <button class="killer-card" data-action="pick-killer" data-killer="trapper"><img src="resource/killer-trapper.png" alt=""><span data-i18n="killer.trapper"></span></button>
          <button class="killer-card" data-action="pick-killer" data-killer="nurse"><img src="resource/killer-nurse.png" alt=""><span data-i18n="killer.nurse"></span></button>
          <button class="killer-card" data-action="pick-killer" data-killer="huntress"><img src="resource/killer-huntress.png" alt=""><span data-i18n="killer.huntress"></span></button>
          <button class="killer-card" data-action="pick-killer" data-killer="hillbilly"><img src="resource/killer-hillbilly.png" alt=""><span data-i18n="killer.hillbilly"></span></button>
        </div>
      </div>
    </section>

    <!-- ===== KILLER PLAY ===== -->
    <section id="screen-killer" class="screen hidden">
      <div class="topbar">
        <button class="icon-btn" data-action="back" aria-label="back">&lsaquo;</button>
        <button class="portrait-btn" data-action="toggle" data-panel="killer-power"><img id="killer-portrait" src="" alt=""></button>
        <span class="topbar-title" id="killer-name"></span>
        <button class="lang-btn" data-action="lang"></button>
        <button class="text-btn" data-action="toggle" data-panel="killer-rules" data-i18n="ui.rules"></button>
      </div>
      <div class="tile-bar"><span data-i18n="ui.revealTiles"></span><div class="tile-priority" id="killer-tile-priority"></div></div>

      <div class="panel hidden" id="panel-killer-power" data-action="toggle" data-panel="killer-power">
        <h3 id="killer-power-title"></h3>
        <div id="killer-power-body"></div>
        <p class="hint" data-i18n="ui.tapToClose"></p>
      </div>

      <div class="panel hidden" id="panel-killer-rules">
        <div id="killer-rules-body"></div>
        <p class="hint" data-i18n="ui.tapToClose"></p>
      </div>

      <div class="counters">
        <div class="counter" id="counter-killer-bp">
          <div class="counter-label"><img src="resource/icon-bp.png" alt=""><span data-i18n="ui.bp"></span></div>
          <div class="counter-ctl">
            <button class="ctl-btn" data-action="count" data-counter="killer-bp" data-delta="-1">&minus;</button>
            <input class="ctl-val" type="number" inputmode="numeric" min="0" max="12" value="4" data-counter="killer-bp">
            <button class="ctl-btn plus" data-action="count" data-counter="killer-bp" data-delta="1">+</button>
          </div>
          <div class="counter-note" id="killer-bp-note"></div>
        </div>
        <div class="counter" id="counter-sacrifice">
          <div class="counter-label"><img src="resource/tile-hook.png" alt=""><span data-i18n="ui.sacrifice"></span></div>
          <div class="counter-ctl">
            <button class="ctl-btn" data-action="count" data-counter="sacrifice" data-delta="-1">&minus;</button>
            <input class="ctl-val" type="number" inputmode="numeric" min="0" max="8" value="0" data-counter="sacrifice">
            <button class="ctl-btn plus blink" data-action="count" data-counter="sacrifice" data-delta="1">+</button>
          </div>
          <div class="counter-note" id="sacrifice-note" data-i18n="ui.sacrificeHint"></div>
        </div>
      </div>

      <div class="stage" id="killer-stage" data-action="roll-move">
        <div class="stage-idle" id="killer-stage-idle">
          <img class="die-img" src="resource/die-black.png" alt="">
          <p data-i18n="ui.tapToRoll"></p>
        </div>
        <div class="stage-result hidden" id="killer-stage-result"></div>
      </div>

      <div class="skillcheck" id="killer-skillcheck"></div>

      <div class="accordion" id="killer-priority">
        <button class="acc-head" data-action="toggle" data-panel="killer-priority-body">
          <span data-i18n="ui.interactionPriority"></span><span class="chev">&#8964;</span>
        </button>
        <div class="acc-body hidden" id="panel-killer-priority-body"></div>
      </div>
    </section>

    <!-- ===== SURVIVORS PLAY ===== -->
    <section id="screen-survivors" class="screen hidden">
      <div class="topbar">
        <button class="icon-btn" data-action="back" aria-label="back">&lsaquo;</button>
        <button class="portrait-row" data-action="toggle" data-panel="survivor-power">
          <img src="resource/survivor-dwight.png" alt=""><img src="resource/survivor-meg.png" alt=""><img src="resource/survivor-jake.png" alt=""><img src="resource/survivor-claudette.png" alt="">
        </button>
        <button class="lang-btn" data-action="lang"></button>
        <button class="text-btn" data-action="toggle" data-panel="survivor-items" data-i18n="ui.items"></button>
        <button class="text-btn" data-action="toggle" data-panel="survivor-rules" data-i18n="ui.rules"></button>
      </div>
      <div class="tile-bar"><span data-i18n="ui.revealTiles"></span><div class="tile-priority" id="survivor-tile-priority"></div></div>

      <div class="panel hidden" id="panel-survivor-power" data-action="toggle" data-panel="survivor-power">
        <h3 data-i18n="ui.survivorPowers"></h3>
        <div id="survivor-power-body"></div>
        <p class="hint" data-i18n="ui.tapToClose"></p>
      </div>
      <div class="panel hidden" id="panel-survivor-items">
        <h3 data-i18n="ui.items"></h3>
        <div id="survivor-items-body"></div>
        <p class="hint" data-i18n="ui.tapToClose"></p>
      </div>
      <div class="panel hidden" id="panel-survivor-rules">
        <div id="survivor-rules-body"></div>
        <p class="hint" data-i18n="ui.tapToClose"></p>
      </div>

      <div class="counters survivors" id="survivor-counters"></div>

      <div class="forced-move" data-i18n-html="surv.forcedMove"></div>

      <div class="stage" id="survivor-stage" data-action="draw-card">
        <div class="stage-idle" id="survivor-stage-idle">
          <div class="deck-back"><img src="resource/icon-bp.png" alt=""><span id="deck-count"></span></div>
          <p data-i18n="ui.tapToDraw"></p>
        </div>
        <div class="stage-result hidden" id="survivor-stage-result"></div>
      </div>
      <div class="deck-tools">
        <button class="text-btn" data-action="draw-again" data-i18n="ui.drawAgain"></button>
        <button class="text-btn ghost" data-action="reset-deck" data-i18n="ui.resetDeck"></button>
      </div>

      <div class="skillcheck" id="survivor-skillcheck"></div>

      <div class="accordion" id="survivor-priority">
        <button class="acc-head" data-action="toggle" data-panel="survivor-priority-body">
          <span data-i18n="ui.interactionPriority"></span><span class="chev">&#8964;</span>
        </button>
        <div class="acc-body hidden" id="panel-survivor-priority-body"></div>
      </div>
    </section>

  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
